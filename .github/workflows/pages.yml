name: Deploy static content to Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Stage site files
        run: |
          mkdir -p _site/references _site/scripts
          cp index.html app.js styles.css color-picker.css add-ui.css genui-renderer.js _site/
          cp -r references/media references/fonts _site/references/
          cp -r scripts/config _site/scripts/
          cp -r scripts/alt-prompts _site/scripts/
          cp scripts/alt_to_dsl_converter.py _site/scripts/
          cp scripts/taskspec_to_alt_chat_completions.py _site/scripts/
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
